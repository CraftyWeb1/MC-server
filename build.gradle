plugins {
    id "fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation include("io.github.miniplaceholders:miniplaceholders-api:2.2.1")
    modImplementation include("net.kyori:adventure-api:4.14.0")
    modImplementation include("net.kyori:adventure-text-minimessage:4.14.0")
    modImplementation include("net.kyori:adventure-key:4.14.0")
    modImplementation include("net.kyori:examination-api:1.3.0")
    modImplementation include("net.kyori:examination-string:1.3.0")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}
